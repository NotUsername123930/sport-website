<h2>Останні новини</h2>

{% for news in latest_news %}

<div>
    <strong>{{ news.title }}</strong>

    <br>

    {{ news.source }}

    <br>

    {{ news.published_at|date:"d.m.Y H:i" }}

    <br>

    <a href="{{ news.article_url }}" target="_blank">
        Читати далі →
    </a>
</div>

<hr>

{% empty %}

<p>Новин поки немає.</p>

{% endfor %}
