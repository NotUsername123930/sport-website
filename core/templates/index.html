<!DOCTYPE html>
<html>
<head>
    <title>Footy</title>
</head>
<body>

<h1>Матчі</h1>

{% for match in matches %}
<div>
    <strong>{{ match.league_name }}</strong><br>

    {{ match.home_team }}

    {% if match.status == 'NS' %}
        vs
    {% else %}
        {{ match.home_score }} : {{ match.away_score }}
    {% endif %}

    {{ match.away_team }}

    <br>
    Статус: {{ match.status }}
</div>

<hr>

{% empty %}
<p>Матчів не знайдено.</p>
{% endfor %}

</body>
</html>
