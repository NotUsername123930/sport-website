{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація — JustSport</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<main class="auth-card">
    <a class="brand" href="{% url 'home' %}">JustSport<span>.</span></a>
    <h1>Реєстрація</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="date-submit" type="submit">
            Створити акаунт
        </button>
    </form>

    <p class="muted">
        Уже маєш акаунт?
        <a href="{% url 'login' %}">Увійти</a>
    </p>
</main>
</body>
</html>
